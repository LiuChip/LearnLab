name: CI

# 触发范围：main 的推送、指向 main 的 PR、以及手动触发。
# 只读权限：CI 不需要写仓库，最小权限原则。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支连续推送时取消上一次，避免排队浪费额度。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # 一个平台失败时另一个仍跑完，便于判断是平台问题还是代码问题。
      fail-fast: false
      matrix:
        # ubuntu 是通用基线；macos 是主要开发平台，能暴露路径分隔符/大小写敏感等差异。
        os: [ubuntu-latest, macos-latest]
    env:
      # 构建只需要 electron 包的 JS 元数据，不需要二进制；
      # 跳过下载可省 ~100MB 并避开 Electron 下载源的不稳定。
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build
